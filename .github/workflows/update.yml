name: update nouride

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = latest)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Bump sources.json
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          repo=nouverse/nouride-releases
          tag=${TAG:-$(gh release view -R "$repo" --json tagName --jq .tagName)}
          base="https://github.com/$repo/releases/download/$tag"
          sums=$(curl -fsSL "$base/SHA256SUMS"; curl -fsSL "$base/SHA256SUMS-router")

          hashes='{}'
          for name in nouride-linux-x64 nouride-linux-arm64 nouride-router-linux-x64 nouride-router-linux-arm64; do
            hex=$(awk -v f="$name.tar.gz" '$2 == f { print $1 }' <<<"$sums")
            [ -n "$hex" ] || { echo "no checksum for $name in $tag" >&2; exit 1; }
            sri=$(nix hash convert --hash-algo sha256 --to sri "$hex")
            hashes=$(jq --arg k "$name" --arg v "$sri" '. + {($k): $v}' <<<"$hashes")
          done
          jq -n --arg v "${tag#v}" --argjson h "$hashes" '{version: $v, hashes: $h}' >sources.json

          echo "version=$(jq -r .version sources.json)" >>"$GITHUB_OUTPUT"
          git diff --quiet sources.json && echo "changed=false" >>"$GITHUB_OUTPUT" || echo "changed=true" >>"$GITHUB_OUTPUT"

      - name: Build
        if: steps.bump.outputs.changed == 'true'
        run: nix build --print-build-logs .#nouride .#nouride-router

      - name: Open pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/nouride
          delete-branch: true
          add-paths: sources.json
          commit-message: "nouride: ${{ steps.bump.outputs.version }}"
          title: "nouride: ${{ steps.bump.outputs.version }}"
          body: |
            Bumps nouride to [v${{ steps.bump.outputs.version }}](https://github.com/nouverse/nouride-releases/releases/tag/v${{ steps.bump.outputs.version }}).
            Both editions built on x86_64-linux.
